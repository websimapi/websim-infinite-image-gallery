<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Image Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "marked": "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js",
                "dompurify": "https://cdn.jsdelivr.net/npm/dompurify/dist/purify.es.min.js"
            }
        }
    </script>
</head>
<body>
    <div class="background-container" id="backgroundContainer"></div>
    
    <button class="floating-btn" onclick="openCommentModal()">
        <span class="plus-icon">+</span>
    </button>

    <div class="modal" id="commentModal">
        <div class="modal-content">
            <span class="close" onclick="closeCommentModal()">&times;</span>
            <h3>Add Your Art</h3>
            <div class="tab-container">
                <button class="tab-btn active" onclick="switchTab('upload')">Upload</button>
                <button class="tab-btn" onclick="switchTab('generate')">Generate AI</button>
            </div>
            
            <div id="uploadTab" class="tab-content">
                <input type="file" id="imageInput" accept="image/*" multiple>
                <div class="image-preview-container" id="uploadPreview"></div>
            </div>
            
            <div id="generateTab" class="tab-content" style="display: none;">
                <textarea id="promptInput" placeholder="Describe your masterpiece..."></textarea>
                <button class="generate-btn" onclick="generateImage()">✨ Generate Image</button>
                <div class="image-preview-container" id="generatePreview"></div>
            </div>
            
            <textarea id="commentInput" placeholder="Share the story behind your art..."></textarea>
            <button onclick="submitComment()" id="submitBtn">Submit with Tip</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
